# Production example
#
# Recommended configuration for production environments:
#   - Custom API path to avoid conflicts with application routes
#   - Authentication required for both the API and Swagger UI
#   - Swagger group name aligned with the custom path
#   - Explicit history bounds and a stable node identity

cronctl:
  api:
    base-path: /manage/tasks
    public-access: false
  swagger:
    public-access: false
    group: task-management
    paths-to-match: /manage/tasks/**
  history:
    max-entries: 20000
    retention: 14d
    cleanup-interval: 10m
    node-id: ${HOSTNAME:task-service-local}

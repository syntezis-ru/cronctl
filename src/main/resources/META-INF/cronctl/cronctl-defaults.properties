# Enable cronctl (set false to disable the entire library).
cronctl.enabled=true
# Scan strategy: AUTO, ANNOTATED, PACKAGE.
cronctl.scan.type=AUTO
# Base path for the cronctl REST API.
cronctl.api.base-path=/api/cronctl
# Allow unauthenticated access to the cronctl API.
cronctl.api.public-access=true
# Allow unauthenticated access to Swagger UI.
cronctl.swagger.public-access=true
# Swagger group name.
cronctl.swagger.group=cronctl
# Paths included in the cronctl Swagger group.
cronctl.swagger.paths-to-match=/api/cronctl/**
# Enable the operator UI when Thymeleaf is available.
cronctl.ui.enabled=true
# Async executor: number of threads.
cronctl.executor.thread-pool-size=4
# Async executor: max tasks waiting in the queue.
cronctl.executor.queue-capacity=100
# Async executor: default timeout in seconds (0 = no timeout).
cronctl.executor.timeout-seconds=60
# Execution history: maximum terminal records retained in memory.
cronctl.history.max-entries=1000
# Execution history: maximum age of terminal records.
cronctl.history.retention=7d
# Execution history: interval between deletion of expired terminal records.
cronctl.history.cleanup-interval=10m
# Execution history: node id is derived when omitted.
